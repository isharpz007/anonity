name: anonity
description: "Anonity — Speak freely. Stay anonymous."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  supabase_flutter: ^2.8.0
  dynamic_color: ^1.8.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  image_path: "assets/images/g.png"
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true

# FIX: app_links is pulled in transitively by supabase_flutter (used for
# OAuth/deep-link redirects). Version 7.0.0 has a known AGP/Gradle 8.x
# release-variant bug that fails with "Cannot query the value of this
# provider because it has no value available." during
# `:app_links:compileReleaseJavaWithJavac`. Forcing a newer patch here
# works around it without needing supabase_flutter itself to bump its
# constraint yet.
dependency_overrides:
  # app_links: ^7.2.1
   app_links: ^6.4.1