<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Anonity — Speak freely. Stay anonymous.">

  <!--
    viewport-fit=cover lets the page draw underneath the iPhone notch /
    Dynamic Island / status-bar area instead of leaving it to the
    browser's default (white) background. Paired with the dark
    background-color below and the theme-color meta tag, this closes
    the white gap at the top of the screen on iOS.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- Tints the browser chrome (and, in standalone/home-screen mode,
       the status-bar area) to match the app instead of default white. -->
  <meta name="theme-color" content="#0B0A10">

  <!-- iOS: lets content flow under the status bar instead of pushing
       a white bar down from behind it; only fully applies once the
       app is added to the Home Screen, but doesn't hurt in-browser. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Anonity">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Anonity</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Paint the page dark immediately — before Flutter's canvas has
       even mounted — so there's no flash (or persistent strip) of
       white behind the notch/status bar while the app boots. */
    html, body {
      background-color: #0B0A10;
      margin: 0;
      height: 100%;
    }
  </style>

  <script>
    // The value below is injected by flutter build, do not touch.
    var serviceWorkerVersion = null;
  </script>
  <script src="flutter.js" defer></script>
</head>
<body>
  <script>
    window.addEventListener('load', function (ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function (engineInitializer) {
          engineInitializer.initializeEngine().then(function (appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
